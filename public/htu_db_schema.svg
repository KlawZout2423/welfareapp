<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 950" width="100%" height="100%" style="background-color: #ffffff; font-family: 'DM Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients & FX -->
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0f1829"/>
    </linearGradient>
    <linearGradient id="tblHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2a3b63"/>
    </linearGradient>
    <linearGradient id="goldTblHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <marker id="relArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a2744"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1170" height="65" rx="10" fill="url(#hdrGrad)" stroke="#c9a227" stroke-width="2"/>
  <text x="625" y="55" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">HTU STAFF WELFARE SCHEME MANAGEMENT SYSTEM</text>
  <text x="625" y="78" text-anchor="middle" fill="#c9a227" font-size="14" font-weight="600">RELATIONAL DATABASE SCHEMA (POSTGRESQL / SUPABASE ERD)</text>

  <!-- ==================== TABLE 1: MEMBERS (CENTRAL ENTITY) ==================== -->
  <g transform="translate(475, 120)">
    <rect x="0" y="0" width="300" height="340" rx="8" fill="#f8fafc" stroke="#c9a227" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="40" rx="8" fill="url(#goldTblHdr)"/>
    <text x="150" y="25" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">🔑 members (Users &amp; Staff)</text>

    <!-- Column Rows -->
    <text x="15" y="65" fill="#0f1829" font-size="12" font-weight="bold">id [PK]</text><text x="285" y="65" text-anchor="end" fill="#9a3412" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="90" fill="#0f1829" font-size="12">name</text><text x="285" y="90" text-anchor="end" fill="#475569" font-size="11">VARCHAR(255)</text>
    <text x="15" y="115" fill="#0f1829" font-size="12">union_name</text><text x="285" y="115" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
    <text x="15" y="140" fill="#0f1829" font-size="12">email [UNIQUE]</text><text x="285" y="140" text-anchor="end" fill="#475569" font-size="11">VARCHAR(255)</text>
    <text x="15" y="165" fill="#0f1829" font-size="12">phone</text><text x="285" y="165" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
    <text x="15" y="190" fill="#0f1829" font-size="12">password_hash</text><text x="285" y="190" text-anchor="end" fill="#475569" font-size="11">VARCHAR(255)</text>
    <text x="15" y="215" fill="#0f1829" font-size="12">role</text><text x="285" y="215" text-anchor="end" fill="#2563eb" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="240" fill="#0f1829" font-size="12">status</text><text x="285" y="240" text-anchor="end" fill="#059669" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="265" fill="#0f1829" font-size="12">dept</text><text x="285" y="265" text-anchor="end" fill="#475569" font-size="11">VARCHAR(255)</text>
    <text x="15" y="290" fill="#0f1829" font-size="12">paid_months / total_months</text><text x="285" y="290" text-anchor="end" fill="#475569" font-size="11">INT</text>
    <text x="15" y="315" fill="#0f1829" font-size="12">enrolled_date</text><text x="285" y="315" text-anchor="end" fill="#475569" font-size="11">DATE</text>
  </g>

  <!-- ==================== TABLE 2: CONTRIBUTIONS ==================== -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="280" height="240" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="35" rx="8" fill="url(#tblHdr)"/>
    <text x="140" y="23" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">💳 contributions</text>

    <text x="15" y="60" fill="#0f1829" font-size="12" font-weight="bold">id [PK]</text><text x="265" y="60" text-anchor="end" fill="#9a3412" font-size="11" font-weight="bold">SERIAL</text>
    <text x="15" y="85" fill="#2563eb" font-size="12" font-weight="bold">member_id [FK]</text><text x="265" y="85" text-anchor="end" fill="#2563eb" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="110" fill="#0f1829" font-size="12">reference (Paystack)</text><text x="265" y="110" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
    <text x="15" y="135" fill="#0f1829" font-size="12">month</text><text x="265" y="135" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
    <text x="15" y="160" fill="#0f1829" font-size="12">date_paid</text><text x="265" y="160" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
    <text x="15" y="185" fill="#0f1829" font-size="12">amount</text><text x="265" y="185" text-anchor="end" fill="#059669" font-size="11" font-weight="bold">DECIMAL(10,2)</text>
    <text x="15" y="210" fill="#0f1829" font-size="12">status</text><text x="265" y="210" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
  </g>

  <!-- ==================== TABLE 3: DUES_LEDGER ==================== -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="280" height="200" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="35" rx="8" fill="url(#tblHdr)"/>
    <text x="140" y="23" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">📊 dues_ledger</text>

    <text x="15" y="60" fill="#2563eb" font-size="12" font-weight="bold">id [PK, FK -> members.id]</text><text x="265" y="60" text-anchor="end" fill="#2563eb" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="85" fill="#0f1829" font-size="12">name / union_name</text><text x="265" y="85" text-anchor="end" fill="#475569" font-size="11">VARCHAR</text>
    <text x="15" y="110" fill="#0f1829" font-size="12">jan..dec (Monthly Flags)</text><text x="265" y="110" text-anchor="end" fill="#475569" font-size="11">BOOLEAN</text>
    <text x="15" y="135" fill="#0f1829" font-size="12">total (Months Paid)</text><text x="265" y="135" text-anchor="end" fill="#475569" font-size="11">INT</text>
  </g>

  <!-- ==================== TABLE 4: CLAIMS ==================== -->
  <g transform="translate(920, 120)">
    <rect x="0" y="0" width="280" height="240" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="35" rx="8" fill="url(#tblHdr)"/>
    <text x="140" y="23" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">📄 claims</text>

    <text x="15" y="60" fill="#0f1829" font-size="12" font-weight="bold">id [PK]</text><text x="265" y="60" text-anchor="end" fill="#9a3412" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="85" fill="#2563eb" font-size="12" font-weight="bold">index_id [FK -> members.id]</text><text x="265" y="85" text-anchor="end" fill="#2563eb" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="110" fill="#0f1829" font-size="12">applicant</text><text x="265" y="110" text-anchor="end" fill="#475569" font-size="11">VARCHAR(255)</text>
    <text x="15" y="135" fill="#0f1829" font-size="12">type (Medical, Bereavement)</text><text x="265" y="135" text-anchor="end" fill="#475569" font-size="11">VARCHAR(100)</text>
    <text x="15" y="160" fill="#0f1829" font-size="12">amount</text><text x="265" y="160" text-anchor="end" fill="#059669" font-size="11" font-weight="bold">DECIMAL(10,2)</text>
    <text x="15" y="185" fill="#0f1829" font-size="12">date_filed / status</text><text x="265" y="185" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
    <text x="15" y="210" fill="#0f1829" font-size="12">notes</text><text x="265" y="210" text-anchor="end" fill="#475569" font-size="11">TEXT</text>
  </g>

  <!-- ==================== TABLE 5: CLAIM_DOCUMENTS ==================== -->
  <g transform="translate(920, 400)">
    <rect x="0" y="0" width="280" height="190" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="35" rx="8" fill="url(#tblHdr)"/>
    <text x="140" y="23" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">📎 claim_documents</text>

    <text x="15" y="60" fill="#0f1829" font-size="12" font-weight="bold">id [PK]</text><text x="265" y="60" text-anchor="end" fill="#9a3412" font-size="11" font-weight="bold">SERIAL</text>
    <text x="15" y="85" fill="#2563eb" font-size="12" font-weight="bold">claim_id [FK -> claims.id]</text><text x="265" y="85" text-anchor="end" fill="#2563eb" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="110" fill="#2563eb" font-size="12">member_id [FK]</text><text x="265" y="110" text-anchor="end" fill="#2563eb" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="135" fill="#0f1829" font-size="12">file_name / file_url</text><text x="265" y="135" text-anchor="end" fill="#475569" font-size="11">TEXT</text>
    <text x="15" y="160" fill="#0f1829" font-size="12">uploaded_at</text><text x="265" y="160" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
  </g>

  <!-- ==================== TABLE 6: LOANS ==================== -->
  <g transform="translate(475, 500)">
    <rect x="0" y="0" width="300" height="240" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="35" rx="8" fill="url(#tblHdr)"/>
    <text x="150" y="23" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🏦 loans</text>

    <text x="15" y="60" fill="#0f1829" font-size="12" font-weight="bold">id [PK]</text><text x="285" y="60" text-anchor="end" fill="#9a3412" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="85" fill="#2563eb" font-size="12" font-weight="bold">index_id [FK -> members.id]</text><text x="285" y="85" text-anchor="end" fill="#2563eb" font-size="11" font-weight="bold">VARCHAR(50)</text>
    <text x="15" y="110" fill="#0f1829" font-size="12">applicant</text><text x="285" y="110" text-anchor="end" fill="#475569" font-size="11">VARCHAR(255)</text>
    <text x="15" y="135" fill="#0f1829" font-size="12">amount / repaid</text><text x="285" y="135" text-anchor="end" fill="#059669" font-size="11" font-weight="bold">DECIMAL(10,2)</text>
    <text x="15" y="160" fill="#0f1829" font-size="12">monthly_installment</text><text x="285" y="160" text-anchor="end" fill="#059669" font-size="11" font-weight="bold">DECIMAL(10,2)</text>
    <text x="15" y="185" fill="#0f1829" font-size="12">term / date_filed</text><text x="285" y="185" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
    <text x="15" y="210" fill="#0f1829" font-size="12">status (Pending, Active, Repaid)</text><text x="285" y="210" text-anchor="end" fill="#475569" font-size="11">VARCHAR(50)</text>
  </g>

  <!-- ==================== SYSTEM TABLES (BOTTOM LAYER) ==================== -->
  <!-- audit_logs -->
  <g transform="translate(50, 640)">
    <rect x="0" y="0" width="280" height="150" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="30" rx="8" fill="url(#tblHdr)"/>
    <text x="140" y="20" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🔍 audit_logs</text>
    <text x="15" y="50" fill="#0f1829" font-size="11">id [PK] (SERIAL)</text>
    <text x="15" y="70" fill="#0f1829" font-size="11">username / action</text>
    <text x="15" y="90" fill="#0f1829" font-size="11">details (TEXT) / ip_address</text>
    <text x="15" y="110" fill="#0f1829" font-size="11">timestamp_str</text>
  </g>

  <!-- notifications -->
  <g transform="translate(920, 640)">
    <rect x="0" y="0" width="280" height="150" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="30" rx="8" fill="url(#tblHdr)"/>
    <text x="140" y="20" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🔔 notifications &amp; notices</text>
    <text x="15" y="50" fill="#0f1829" font-size="11">notifications: text, unread, time</text>
    <text x="15" y="75" fill="#0f1829" font-size="11">notices: category, title, body</text>
    <text x="15" y="100" fill="#0f1829" font-size="11">scheme_config: monthly_contrib</text>
  </g>

  <!-- ==================== RELATIONSHIP CONNECTIONS ==================== -->
  <!-- members -> contributions -->
  <path d="M 475 205 L 330 205" fill="none" stroke="#1a2744" stroke-width="2.5" marker-end="url(#relArrow)"/>
  <!-- members -> dues_ledger -->
  <path d="M 475 310 L 330 310 L 330 460 L 330 460" fill="none" stroke="#1a2744" stroke-width="2.5" marker-end="url(#relArrow)"/>
  <!-- members -> claims -->
  <path d="M 775 205 L 920 205" fill="none" stroke="#1a2744" stroke-width="2.5" marker-end="url(#relArrow)"/>
  <!-- claims -> claim_documents -->
  <path d="M 1060 360 L 1060 400" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#relArrow)"/>
  <!-- members -> loans -->
  <path d="M 625 460 L 625 500" fill="none" stroke="#1a2744" stroke-width="2.5" marker-end="url(#relArrow)"/>
</svg>
